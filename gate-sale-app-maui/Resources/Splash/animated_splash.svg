<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    
    <defs>
        <style>
            .fade-in {
                animation: fadeIn 0.8s ease-out forwards;
                opacity: 0;
            }
            
            .scale-in {
                animation: scaleIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
                transform: scale(0.8);
                transform-origin: center;
            }
            
            .slide-in-left {
                animation: slideInLeft 0.6s ease-out 0.4s forwards;
                transform: translateX(-50px);
                opacity: 0;
            }
            
            .slide-in-right {
                animation: slideInRight 0.6s ease-out 0.6s forwards;
                transform: translateX(50px);
                opacity: 0;
            }
            
            .slide-in-up {
                animation: slideInUp 0.5s ease-out 0.8s forwards;
                transform: translateY(20px);
                opacity: 0;
            }
            
            .rotate {
                animation: rotate 2s linear infinite;
                transform-origin: center;
            }
            
            .pulse {
                animation: pulse 2s ease-in-out infinite;
            }
            
            @keyframes fadeIn {
                to { opacity: 1; }
            }
            
            @keyframes scaleIn {
                to { 
                    transform: scale(1);
                    opacity: 1;
                }
            }
            
            @keyframes slideInLeft {
                to { 
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideInRight {
                to { 
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideInUp {
                to { 
                    transform: translateY(0);
                    opacity: 1;
                }
            }
            
            @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            
            @keyframes pulse {
                0%, 100% { opacity: 0.6; }
                50% { opacity: 1; }
            }
        </style>
    </defs>
    
    <!-- Background Circle -->
    <circle cx="228" cy="228" r="200" fill="#6366f1" opacity="0.1" class="fade-in"/>
    
    <!-- Main Logo Container -->
    <g class="scale-in" style="animation-delay: 0.2s;">
        <!-- Gate Icon -->
        <g transform="translate(148, 168)">
            <rect x="0" y="0" width="160" height="120" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
            <rect x="20" y="20" width="120" height="80" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
            <circle cx="140" cy="60" r="6" fill="#ffffff"/>
            <line x1="80" y1="0" x2="80" y2="120" stroke="#ffffff" stroke-width="2"/>
        </g>
        
        <!-- GateSale Text -->
        <g transform="translate(108, 308)">
            <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="start" class="slide-in-left">Gate</text>
        </g>
        
        <g transform="translate(248, 308)">
            <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fbbf24" text-anchor="start" class="slide-in-right">Sale</text>
        </g>
        
        <!-- Tagline -->
        <g transform="translate(228, 338)">
            <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#e5e7eb" text-anchor="middle" class="slide-in-up">Your Campus Marketplace</text>
        </g>
    </g>
    
    <!-- Decorative Elements -->
    <g class="fade-in" style="animation-delay: 0.6s;">
        <circle cx="78" cy="128" r="3" fill="#fbbf24" opacity="0.6" class="pulse" style="animation-delay: 1s;"/>
        <circle cx="378" cy="148" r="2" fill="#ffffff" opacity="0.4" class="pulse" style="animation-delay: 1.2s;"/>
        <circle cx="98" cy="348" r="2" fill="#6366f1" opacity="0.8" class="pulse" style="animation-delay: 1.4s;"/>
        <circle cx="368" cy="328" r="3" fill="#fbbf24" opacity="0.5" class="pulse" style="animation-delay: 1.6s;"/>
    </g>
    
    <!-- Loading Animation Elements -->
    <g transform="translate(228, 380)" class="fade-in" style="animation-delay: 1s;">
        <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
        <circle cx="0" cy="0" r="20" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" 
                stroke-dasharray="31.416" stroke-dashoffset="31.416" opacity="0.8" class="rotate">
        </circle>
    </g>
</svg>