<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    
    <defs>
        <!-- Background gradient -->
        <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
        
        <!-- Gate gradient -->
        <linearGradient id="gateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
        </linearGradient>
        
        <!-- Text gradient -->
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="456" height="456" fill="url(#backgroundGradient)" rx="20" ry="20"/>
    
    <!-- Gate Icon -->
    <g transform="translate(228, 180)">
        <!-- Gate posts -->
        <rect x="-40" y="-20" width="8" height="60" fill="url(#gateGradient)" rx="4"/>
        <rect x="32" y="-20" width="8" height="60" fill="url(#gateGradient)" rx="4"/>
        
        <!-- Gate bars -->
        <rect x="-32" y="-15" width="64" height="6" fill="url(#gateGradient)" rx="3"/>
        <rect x="-32" y="0" width="64" height="6" fill="url(#gateGradient)" rx="3"/>
        <rect x="-32" y="15" width="64" height="6" fill="url(#gateGradient)" rx="3"/>
        
        <!-- Gate handle -->
        <circle cx="20" cy="0" r="3" fill="url(#gateGradient)"/>
    </g>
    
    <!-- GateSale Text -->
    <text x="228" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">GateSale</text>
    
</svg>