<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Dark theme gradient background -->
        <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
            <stop offset="30%" style="stop-color:#2d2d2d;stop-opacity:1" />
            <stop offset="70%" style="stop-color:#404040;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1f1f1f;stop-opacity:1" />
        </linearGradient>
        
        <!-- Dark metallic gradient for gate -->
        <linearGradient id="darkMetalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1" />
        </linearGradient>
        
        <!-- Light gradient for doors (contrast against dark) -->
        <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D3D3D3;stop-opacity:0.95" />
        </linearGradient>
        
        <!-- Enhanced shadow filter -->
        <filter id="modernShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
        
        <!-- Glow effect -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge> 
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Inner glow -->
        <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge> 
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Dark rounded background -->
    <rect x="0" y="0" width="456" height="456" rx="100" ry="100" fill="url(#darkGradient)" />
    
    <!-- Subtle overlay for depth -->
    <rect x="0" y="0" width="456" height="456" rx="100" ry="100" fill="rgba(255,255,255,0.05)" />
    
    <!-- Central focus circle -->
    <circle cx="228" cy="228" r="180" fill="rgba(255,255,255,0.03)" />
    <circle cx="228" cy="228" r="140" fill="rgba(255,255,255,0.06)" />
    
    <!-- Modern gate icon -->
    <g transform="translate(228, 200)">
        <!-- Gate foundation -->
        <rect x="-80" y="35" width="160" height="12" rx="6" fill="url(#darkMetalGradient)" filter="url(#modernShadow)" />
        
        <!-- Left pillar -->
        <rect x="-75" y="-45" width="25" height="80" rx="12" fill="url(#darkMetalGradient)" filter="url(#modernShadow)" />
        <!-- Right pillar -->
        <rect x="50" y="-45" width="25" height="80" rx="12" fill="url(#darkMetalGradient)" filter="url(#modernShadow)" />
        
        <!-- Top arch beam -->
        <path d="M -75 -45 Q 0 -65 75 -45 L 75 -25 Q 0 -45 -75 -25 Z" fill="url(#darkMetalGradient)" filter="url(#modernShadow)" />
        
        <!-- Left gate door -->
        <rect x="-45" y="-25" width="35" height="55" rx="8" fill="url(#lightGradient)" filter="url(#modernShadow)" />
        <!-- Right gate door -->
        <rect x="10" y="-25" width="35" height="55" rx="8" fill="url(#lightGradient)" filter="url(#modernShadow)" />
        
        <!-- Door panels (decorative) -->
        <rect x="-40" y="-18" width="25" height="15" rx="3" fill="rgba(100,149,237,0.4)" />
        <rect x="-40" y="5" width="25" height="15" rx="3" fill="rgba(100,149,237,0.4)" />
        <rect x="15" y="-18" width="25" height="15" rx="3" fill="rgba(100,149,237,0.4)" />
        <rect x="15" y="5" width="25" height="15" rx="3" fill="rgba(100,149,237,0.4)" />
        
        <!-- Modern door handles -->
        <circle cx="-18" cy="2" r="5" fill="url(#darkMetalGradient)" filter="url(#innerGlow)" />
        <circle cx="32" cy="2" r="5" fill="url(#darkMetalGradient)" filter="url(#innerGlow)" />
        
        <!-- Decorative hinges -->
        <rect x="-45" y="-20" width="8" height="8" rx="4" fill="url(#darkMetalGradient)" />
        <rect x="-45" y="8" width="8" height="8" rx="4" fill="url(#darkMetalGradient)" />
        <rect x="37" y="-20" width="8" height="8" rx="4" fill="url(#darkMetalGradient)" />
        <rect x="37" y="8" width="8" height="8" rx="4" fill="url(#darkMetalGradient)" />
    </g>
    
    <!-- Dark theme app name with better typography -->
    <g transform="translate(228, 320)">
        <!-- "Gate" text with shadow -->
        <text x="-42" y="4" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="rgba(0,0,0,0.3)" text-anchor="middle">Gate</text>
        <text x="-40" y="2" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#E8E8E8" text-anchor="middle" filter="url(#glow)">Gate</text>
        
        <!-- "Sale" text with shadow -->
        <text x="42" y="4" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="rgba(0,0,0,0.3)" text-anchor="middle">Sale</text>
        <text x="40" y="2" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#DAA520" text-anchor="middle" filter="url(#glow)">Sale</text>
    </g>
    
    <!-- Modern light effects -->
    <ellipse cx="150" cy="100" rx="80" ry="40" fill="rgba(255,255,255,0.15)" transform="rotate(-25 150 100)" />
    <ellipse cx="320" cy="350" rx="60" ry="30" fill="rgba(255,255,255,0.1)" transform="rotate(45 320 350)" />
    
    <!-- Corner accent dots -->
    <circle cx="400" cy="56" r="12" fill="rgba(255,255,255,0.2)" />
    <circle cx="56" cy="400" r="10" fill="rgba(255,255,255,0.15)" />
    <circle cx="400" cy="400" r="8" fill="rgba(255,255,255,0.1)" />
</svg>